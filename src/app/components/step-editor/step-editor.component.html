<div class="step-list" (focusout)="markTouched()">
  @for (row of rows.controls; track row; let index = $index) {
    <div class="step-row" draggable="true" (dragstart)="onDragStart(index)" (dragover)="$event.preventDefault()" (drop)="onDrop(index)">
      <span class="step-number">{{ index + 1 }}</span>
      <label [for]="'step-' + (index + 1)">Step {{ index + 1 }} instruction</label>
      <textarea class="field-input" [id]="'step-' + (index + 1)" [formControl]="row" maxlength="2000" rows="3" (keydown)="onKeydown($event, index)"></textarea>
      <div class="row-toolbar">
        <span class="drag-handle" title="Drag to reorder" aria-hidden="true"><app-icon name="drag_indicator" [size]="18" /></span>
        <button appButton appearance="secondary" size="s" [iconOnly]="true" type="button" (click)="move(index, -1)" [disabled]="index === 0" [attr.aria-label]="'Move step ' + (index + 1) + ' up'"><app-icon name="arrow_upward" [size]="16" /></button>
        <button appButton appearance="secondary" size="s" [iconOnly]="true" type="button" (click)="move(index, 1)" [disabled]="index === rows.length - 1" [attr.aria-label]="'Move step ' + (index + 1) + ' down'"><app-icon name="arrow_downward" [size]="16" /></button>
        <button appButton appearance="secondary-destructive" size="s" [iconOnly]="true" type="button" (click)="remove(index)" [disabled]="rows.length === 1" [attr.aria-label]="'Remove step ' + (index + 1)"><app-icon name="trash" [size]="16" /></button>
      </div>
      @if (row.touched && row.invalid) { <p class="field-error">Step instruction is required.</p> }
    </div>
  }
</div>
<button appButton appearance="secondary" type="button" (click)="add()"><app-icon name="add" [size]="16" /> Add step</button>
