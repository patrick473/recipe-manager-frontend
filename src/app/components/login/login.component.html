<div class="auth-page">
  <div class="card-lg auth-card">
    <h2 class="form-title">Log in</h2>

    @if (submitError()) {
      <div class="notification notification-negative mb">{{ submitError() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input
          id="username"
          class="field-input"
          formControlName="username"
          placeholder="Username"
          autocomplete="username"
        />
        @if (isInvalid('username')) {
          <p class="field-error">Username is required.</p>
        }
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="field-input"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
        />
        @if (isInvalid('password')) {
          <p class="field-error">Password is required.</p>
        }
      </div>

      <div class="form-actions">
        <button appButton appearance="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Logging in…' : 'Log in' }}
        </button>
      </div>
    </form>

    <p class="auth-switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
