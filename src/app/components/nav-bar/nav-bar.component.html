<nav class="side-nav" [class.expanded]="expanded()">
    <div class="side-nav-brand">
        <span class="side-nav-icon side-nav-icon--brand">
            <app-icon name="blender" [size]="22" />
        </span>
        @if (expanded()) {
        <span class="side-nav-title">Recipe Manager</span>
        }
    </div>

    <div class="side-nav-links">
        <a
            routerLink="/recipes"
            appButton
            appearance="flat"
            size="s"
            class="side-nav-link"
            [attr.title]="expanded() ? null : 'Recipes'">
            <span class="side-nav-icon">
                <app-icon name="list" [size]="18" />
            </span>
            @if (expanded()) {
            <span class="side-nav-text">Recipes</span>
            }
        </a>
        <a
            routerLink="/recipes/new"
            appButton
            appearance="primary"
            size="s"
            class="side-nav-link"
            [attr.title]="expanded() ? null : 'New Recipe'">
            <span class="side-nav-icon">
                <app-icon name="add" [size]="18" />
            </span>
            @if (expanded()) {
            <span class="side-nav-text">New Recipe</span>
            }
        </a>
    </div>
    <button
        appButton
        appearance="flat"
        size="s"
        type="button"
        class="side-nav-toggle"
        [attr.aria-label]="expanded() ? 'Collapse navigation' : 'Expand navigation'"
        (click)="toggleExpanded()">

        @if (expanded()) {
        <span class="side-nav-icon">
            <app-icon name="chevron_left" [size]="18" />
        </span>
        <span class="side-nav-text">Collapse</span>
        } @else {
        <span class="side-nav-icon">
            <app-icon name="chevron_right" [size]="18" />
        </span>
        }
    </button>

    <button
        appButton
        appearance="flat"
        size="s"
        type="button"
        class="side-nav-theme-toggle"
        [attr.aria-label]="theme.darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="toggleTheme()">
        <span class="side-nav-icon">
            <app-icon [name]="theme.darkMode() ? 'sunny' : 'bedtime'" [size]="18" />
        </span>
        @if (expanded()) {
        <span class="side-nav-text">{{ theme.darkMode() ? 'Light mode' :
            'Dark mode' }}</span>
        }
    </button>
</nav>
